portraitCredit: "Photo: Federico Castelli"
bio: |
  **Nicolò Bottasso** (b. 1994 in Italy, based in the Netherlands) is a violinist, trumpeter, composer and sound artist working across **experimental**, **contemporary** and **folk-derived** music.
  His practice centres on **improvisation**, **timbre** and **repetition**, integrating acoustic instruments and live processing into an organic sonic practice in dialogue with moving image, archival material and site-specific performance. He is interested in how inherited musical languages shift when they encounter new contexts and modes of perception.
  His long-standing collaboration with his brother Simone as **Duo Bottasso** has been a continuous laboratory for this practice for nearly two decades.
  Since 2024, he has performed on a **tenore d’amore**, a custom sympathetic-string instrument developed with luthier Cesar Sakellarides, combining features of the baryton violin, viola d’amore and Hardanger fiddle.
  Selected presentations of his projects include **Eye Filmmuseum** (Amsterdam), **LAC** (Lugano), **Deutsches Filminstitut & Filmmuseum DFF** (Frankfurt), **Nonagon Festival** (Svanö) and **MACRO** (Rome).
