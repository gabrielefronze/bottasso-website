reviews:
  - quote: >
      One of the things I admire most about Nicolò is his ability to integrate
      rapidly and meaningfully within a pre-existing musical context. His
      improvisational input has been essential to shaping the distinctive
      character of Caravan. As a musician, he brings not only strong technical
      skills, but also an open ear and a genuine curiosity that enriches every
      collaboration
    name: Julian Schneemann
    role: pianist, artistic director of Pynarello Ensemble
  - quote: >
      Postcards from Italy is a dense, intense, and moving project. Contemporary
      and right
    name: Paolo Fresu
    role: trumpeter, artistic director of Time in Jazz
  - quote: >
      An artist, but above all a storyteller, who undoubtedly possesses a
      visceral connection with his inner world, and conveys it to the audience
      in a way that transcends the physicality of an instrument, without fear of
      exposing his most vulnerable self: inevitably, whose who listen to him
      find themselves vibrating in response
    name: Fabiola Tedesco
    role: soloist, concertmaster at Noord Nederlands Orkest
